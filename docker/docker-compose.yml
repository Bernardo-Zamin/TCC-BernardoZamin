# Isolation:
#  - no kernel capabilities and no new privileges
#  - read-only root filesystem: only results/ is written to disk
#  - process, memory and CPU limits, so a looping agent cannot take down the machine
# Network egress is filtered on the host (nftables_allowlist.sh).

services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../results:/app/results:rw
      - ../harness:/app/harness:ro
      - ../scripts:/app/scripts:ro
      - ../tests:/app/tests:ro
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks:
      - isolated

networks:
  isolated:
    driver: bridge
    internal: false  # must reach the model APIs
